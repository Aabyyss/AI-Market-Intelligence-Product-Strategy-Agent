<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>market-intel console</title>
<style>
  /* Two palettes over one set of tokens: the default is dark, [data-theme]
     overrides it, and the boot script honors a saved choice or the OS. */
  :root{
    color-scheme:dark;
    --bg:#0b0f14;--panel:#11161d;--panel2:#161d26;--line:#26303c;--line2:#324050;
    --fg:#e6edf3;--dim:#98a4b0;--faint:#5c6873;
    --acc:#4c9ffe;--acc-contrast:#ffffff;--acc-soft:rgba(76,159,254,.12);
    --ok:#3fb950;--warn:#d29922;--bad:#f85149;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 6px 24px rgba(0,0,0,.45);
    --mono:ui-monospace,Consolas,"Cascadia Mono",monospace;
  }
  [data-theme="light"]{
    color-scheme:light;
    --bg:#f6f8fa;--panel:#ffffff;--panel2:#eef1f4;--line:#d5dbe1;--line2:#bfc7cf;
    --fg:#1f2328;--dim:#59636e;--faint:#818b94;
    --acc:#0969da;--acc-contrast:#ffffff;--acc-soft:rgba(9,105,218,.10);
    --ok:#1a7f37;--warn:#9a6700;--bad:#cf222e;
    --shadow-sm:0 1px 2px rgba(31,35,40,.08);
    --shadow-md:0 8px 28px rgba(31,35,40,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font:14.5px/1.6 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    transition:background-color .25s ease,color .25s ease}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:12px;padding:11px 20px;border-bottom:1px solid var(--line);
    background:var(--panel);box-shadow:var(--shadow-sm);position:relative;z-index:2;
    transition:background-color .25s ease}
  .brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:1.02rem;letter-spacing:-.01em}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
  .brand small{color:var(--faint);font-weight:400;font-size:.78rem;letter-spacing:0}
  #health{display:flex;align-items:center;gap:7px;font-size:.8rem;color:var(--dim);margin-left:14px;min-width:0}
  #health .hdot{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none;transition:background .3s}
  #health.online .hdot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  #health .hmeta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-variant-numeric:tabular-nums}
  .spacer{flex:1}
  .ver{font-family:var(--mono);font-size:.74rem;color:var(--dim);border:1px solid var(--line);
    border-radius:10px;padding:3px 10px;background:var(--bg);white-space:nowrap}
  .ver a{color:var(--dim)} .ver a:hover{color:var(--acc)}
  #theme{font:inherit;font-size:.78rem;background:var(--bg);border:1px solid var(--line);color:var(--dim);
    border-radius:10px;padding:3px 10px;cursor:pointer;line-height:1.4;transition:all .15s}
  #theme:hover{color:var(--acc);border-color:var(--acc)}

  /* ---------- layout ---------- */
  main{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 54px)}
  .side{border-right:1px solid var(--line);padding:18px 16px 26px;
    background:linear-gradient(180deg,var(--panel) 0,var(--bg) 160px)}
  .side h2{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:22px 2px 8px;font-weight:600}
  .side h2:first-child{margin-top:0}
  .content{padding:24px 30px 60px;overflow:auto}
  .content > *{max-width:72ch}
  .content > .cards{max-width:none}
  @media (max-width:860px){main{grid-template-columns:1fr}.side{border-right:none;border-bottom:1px solid var(--line)}.content{padding:18px}}

  /* ---------- forms ---------- */
  .side input,.side textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    color:var(--fg);padding:8px 10px;margin:4px 0 8px;font:inherit;transition:border-color .15s,background-color .25s}
  .side input:focus,.side textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
  .side textarea{resize:vertical;min-height:64px}
  .side button,.btn{font:inherit;font-weight:550;background:#1c2530;border:1px solid var(--line2);border-radius:8px;
    color:var(--fg);padding:8px 12px;cursor:pointer;
    transition:border-color .15s,background .15s,transform .06s}
  [data-theme="light"] .side button,[data-theme="light"] .btn{background:var(--panel2)}
  .side button:hover,.btn:hover{border-color:var(--acc)}
  .side button:active,.btn:active{transform:translateY(1px)}
  .side button:disabled{opacity:.45;cursor:default}
  .side button.primary{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:600}
  .side button.primary:hover{background:var(--acc);color:var(--acc-contrast)}
  .btnrow{display:flex;gap:8px;margin-top:2px}
  .btnrow button{flex:1}
  label{font-size:.76rem;color:var(--dim)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .chip{font-size:.74rem;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:2px 10px;
    cursor:pointer;background:var(--bg);transition:all .15s}
  .chip:hover{color:var(--acc);border-color:var(--acc);background:var(--acc-soft)}

  /* ---------- jobs list ---------- */
  #jobs{width:100%;border-collapse:collapse;max-width:none}
  #jobs td{padding:7px 4px;border-bottom:1px solid var(--line);font-size:.82rem}
  #jobs tr{cursor:pointer} #jobs tr:hover td{background:var(--acc-soft)}
  #jobs .jlabel{display:block;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #jobs .jmeta{color:var(--faint);font-size:.7rem;margin-top:1px;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;border-radius:10px;padding:1px 9px;font-size:.7rem;border:1px solid var(--line);font-family:var(--mono)}
  .pill.ok{color:var(--ok);border-color:var(--ok)}
  .pill.warn{color:var(--warn);border-color:var(--warn)}
  .pill.bad{color:var(--bad);border-color:var(--bad)}
  .pill.run{color:var(--acc);border-color:var(--acc)}
  .pill.run.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-right:5px;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  /* ---------- cards & content ---------- */
  .cards{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 15px;min-width:128px;
    box-shadow:var(--shadow-sm);transition:background-color .25s ease}
  .card .k{font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:3px;font-weight:600}
  .card .v{font-size:1.12rem;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .card .v.small{font-size:.86rem}
  .v.ok{color:var(--ok)} .v.bad{color:var(--bad)}
  h3{font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:.86rem}
  th{text-align:left;color:var(--faint);font-weight:600;font-size:.68rem;text-transform:uppercase;padding:6px 10px;border-bottom:1px solid var(--line)}
  td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  a{color:var(--acc);text-decoration:none} a:hover{text-decoration:underline}
  .muted{color:var(--dim)} .mono{font-family:var(--mono)}
  #empty{color:var(--faint);padding:60px 0;text-align:center}
  .error{border:1px solid var(--bad);border-radius:10px;padding:11px 15px;color:var(--bad);margin:0 0 18px;background:color-mix(in srgb,var(--bad) 7%,transparent)}
  .cite{color:var(--acc);font-size:.74rem;vertical-align:super;margin-left:2px;cursor:help}
  pre{white-space:pre-wrap;font-family:var(--mono);font-size:.8rem;color:var(--fg);line-height:1.55}
  details{margin-top:10px} summary{cursor:pointer;color:var(--dim);font-size:.8rem}
  details pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}

  /* per-competitor evidence bars */
  .barrow{display:grid;grid-template-columns:130px 1fr 40px;gap:10px;align-items:center;margin:6px 0;font-size:.84rem}
  .barrow .btrack{background:var(--panel2);border-radius:5px;height:9px;overflow:hidden}
  .barrow .bfill{height:100%;background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 45%,#fff));
    border-radius:5px;transition:width .4s}
  .barrow .bn{font-family:var(--mono);text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}

  /* home pipeline */
  .pipe{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 6px;max-width:none}
  .pipe .step{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:.78rem;box-shadow:var(--shadow-sm)}
  .pipe .step b{display:block;font-size:.82rem;color:var(--acc);font-weight:600}
  .pipe .arr{color:var(--faint)}
  .homehint{color:var(--dim);font-size:.88rem;margin:10px 0 0}
  .hero{font-size:1.35rem;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
  .hero em{font-style:normal;color:var(--acc)}

  /* ---------- account ---------- */
  .acct input{margin-bottom:6px}
  .acct .who{font-size:.82rem;color:var(--dim);margin:2px 0 8px}
  .acct .who b{color:var(--fg);font-weight:600}
  .hint{font-size:.72rem;color:var(--faint);margin:6px 0 0;line-height:1.5}
  #who b{color:var(--acc);font-weight:600}
  .learn{font-size:.76rem;color:var(--dim);line-height:1.5}
  .learn .lrow{display:flex;justify-content:space-between;gap:6px;padding:3px 0;border-bottom:1px solid var(--line)}
  .learn .lq{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:.72rem}
  .learn .ls{color:var(--acc);font-family:var(--mono);flex:none}

  /* toast */
  #toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:9}
  .toast{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--ok);border-radius:8px;
    padding:9px 14px;font-size:.82rem;box-shadow:var(--shadow-md);animation:slidein .18s ease-out;max-width:320px}
  .toast.bad{border-left-color:var(--bad)}
  @keyframes slidein{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>market-intel <small>console</small></div>
  <div id="health"><span class="hdot"></span><span class="hmeta">connecting...</span></div>
  <div class="spacer"></div>
  <span class="ver"><a href="/docs" target="_blank" rel="noopener" title="OpenAPI docs">API docs</a></span>
  <span class="ver" id="ver"></span>
  <span class="ver" id="who" hidden></span>
  <button id="theme" title="Toggle light / dark (shift+T)" aria-label="Toggle color theme">&#9788;</button>
</header>
<main>
  <nav class="side">
    <h2>Ask the corpus</h2>
    <textarea id="q" placeholder="e.g. what do developers say about platform fees?" title="Ctrl/ Cmd+K to focus"></textarea>
    <label>top_k</label>
    <input id="k" type="number" value="5" min="1" max="20">
    <button id="ask" class="primary">Ask</button>
    <div class="chips" id="chips"></div>

    <h2>Full report</h2>
    <input id="topic" value="developer pain points and unmet needs">
    <label>competitors (comma-separated)</label>
    <input id="comps" value="shopify, woocommerce, bigcommerce">
    <div class="btnrow">
      <button id="report">Generate report</button>
      <button id="refresh" title="Fetch new posts, re-chunk and re-embed">Refresh corpus</button>
    </div>

    <h2>Recent jobs</h2>
    <table id="jobs"><tbody><tr><td class="muted">none yet</td></tr></tbody></table>

    <h2>What it learned</h2>
    <div id="learn" class="learn">…</div>

    <h2>Account</h2>
    <div class="acct" id="acct"></div>
  </nav>
  <section class="content" id="content"></section>
</main>
<div id="toasts"></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>\"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const pollers = new Map();
let currentJob = null;

/* ---------- theme: saved choice wins, then the OS preference ---------- */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $("theme").innerHTML = t === "light" ? "&#9789;" : "&#9788;";
  try { localStorage.setItem("mi-theme", t); } catch { /* private mode */ }
}
let savedTheme = null;
try { savedTheme = localStorage.getItem("mi-theme"); } catch { /* private mode */ }
applyTheme(savedTheme ?? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
$("theme").onclick = () =>
  applyTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
document.addEventListener("keydown", e => {
  if (e.shiftKey && (e.key === "T" || e.key === "t") && !/input|textarea/i.test(document.activeElement.tagName))
    $("theme").onclick();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("q").focus(); }
});

function toast(msg, bad) {
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : "");
  t.textContent = msg;
  $("toasts").appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

/* ---------- auth: bearer token in localStorage, open mode until
   the first account exists server-side ---------- */
function savedAuth() {
  try { return JSON.parse(localStorage.getItem("mi-auth") || "null"); }
  catch { return null; }
}
function saveAuth(t) {
  try { localStorage.setItem("mi-auth", JSON.stringify(t)); } catch { /* private mode */ }
}
function clearAuth() {
  try { localStorage.removeItem("mi-auth"); } catch { /* private mode */ }
}

async function api(path, opts) {
  opts = Object.assign({}, opts);
  opts.headers = Object.assign({}, authHeaders(), opts.headers || {});
  const r = await fetch(path, opts);
  let body = null;
  try { body = await r.json(); } catch { /* non-JSON error body */ }
  if (!r.ok) {
    if (r.status === 401 && !path.startsWith("/auth")) {
      // session expired or revoked: drop the stale token, show sign-in
      clearAuth(); me = null; authMode = true; renderAuth();
    }
    throw Object.assign(new Error((body && (body.detail || body.error)) || r.statusText), {body});
  }
  return body;
}

let me = null;        // {username, role} when signed in
let authMode = false; // true once any account exists server-side

function authHeaders() {
  const t = savedAuth();
  return t && t.token ? { Authorization: "Bearer " + t.token } : {};
}

async function probeAuth() {
  try {
    me = await api("/auth/me");
    authMode = me.username !== "anonymous";
    if (!authMode) me = null;
  } catch { me = null; authMode = true; }
  renderAuth();
}

function renderAuth() {
  const el = $("acct"), who = $("who");
  if (me) {
    who.hidden = false; who.innerHTML = "@<b>" + esc(me.username) + "</b>";
    el.innerHTML = `<div class="who">signed in as <b>${esc(me.username)}</b>
      <span class="pill run">${esc(me.role ?? "user")}</span></div>
      <button id="logout">Sign out</button>`;
    $("logout").onclick = async () => {
      try { await api("/auth/logout", { method: "POST" }); } catch { /* already gone */ }
      clearAuth(); me = null; renderAuth(); refreshJobs(); toast("Signed out");
    };
    return;
  }
  who.hidden = true;
  el.innerHTML = `
    <input id="u" placeholder="username" autocomplete="username">
    <input id="p" type="password" placeholder="password" autocomplete="current-password">
    <div class="btnrow">
      <button id="login">Sign in</button>
      ${authMode ? "" : '<button id="register" class="primary">Create admin</button>'}
    </div>
    <p class="hint">${authMode
      ? "sessions last 7 days; the service token keeps n8n flows working"
      : "open mode: the API is public until the first account is created &mdash; that account becomes the admin and the service locks down"}</p>`;
  $("login").onclick = doLogin;
  if (!authMode) $("register").onclick = doRegister;
  $("p").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
}

/* ---------- self-learning card: what the query loop knows ---------- */
async function loadLearning() {
  try {
    const s = await api("/learning");
    const el = $("learn");
    if (!s.queries_tracked) {
      el.textContent = "nothing yet - gaps and winners appear as reports run";
      return;
    }
    el.innerHTML = `${s.topics} topic${s.topics === 1 ? "" : "s"}, ${s.queries_tracked} tracked:` +
      s.top.slice(0, 3).map(t =>
        `<div class="lrow" title="${esc(t.topic)} - strength ${esc(t.strength)} (times it retrieved)"><span class="lq">${esc(t.query)}</span><span class="ls">x${esc(t.strength)}</span></div>`).join("");
  } catch { $("learn").textContent = "learning stats unavailable"; }
}

async function doLogin() {
  try {
    const t = await api("/auth/login", { method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username: $("u").value.trim(), password: $("p").value}) });
    saveAuth(t); me = {username: t.username, role: t.role};
    renderAuth(); refreshJobs(); toast("Welcome, " + t.username);
  } catch (e) { toast("Sign-in failed: " + e.message, true); }
}

async function doRegister() {
  try {
    const t = await api("/auth/register", { method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username: $("u").value.trim(), password: $("p").value}) });
    saveAuth(t); me = {username: t.username, role: t.role};
    renderAuth(); refreshJobs(); toast("Admin account created: " + t.username);
  } catch (e) { toast("Could not register: " + e.message, true); }
}

function rt(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return new Date(iso).toLocaleDateString();
}
function fmtDur(s) {
  s = Math.round(s ?? 0);
  if (s < 60) return s + "s";
  return Math.floor(s / 60) + "m " + (s % 60) + "s";
}

async function refreshHealth() {
  const el = $("health");
  try {
    const h = await api("/health");
    el.classList.add("online");
    $("ver").textContent = "v" + h.version;
    el.querySelector(".hmeta").textContent =
      `${h.posts} posts - ${h.chunks} chunks - llm: ${h.llm_provider ?? "none"}`;
    if (currentJob === null && !$("content").firstChild) renderHome(h);
    return h;
  } catch {
    el.classList.remove("online");
    el.querySelector(".hmeta").textContent = "API offline - is ./run_api.py running?";
  }
}

function renderHome(h) {
  h = h || {};
  $("content").innerHTML = `
    <div class="hero">Every claim <em>points at a post</em> you can open.</div>
    <div class="cards">
      <div class="card"><div class="k">posts collected</div><div class="v">${esc(h.posts ?? "-")}</div></div>
      <div class="card"><div class="k">embedded chunks</div><div class="v">${esc(h.chunks ?? "-")}</div></div>
      <div class="card"><div class="k">embedding model</div><div class="v small">${esc(h.embeddings ?? "-")}</div></div>
      <div class="card"><div class="k">llm</div><div class="v small">${esc(h.llm_provider ?? "none")}${h.llm_model ? "/" + esc(h.llm_model) : ""}</div></div>
    </div>
    <h3>How a report is built</h3>
    <div class="pipe">
      <div class="step"><b>fetch</b>Hacker News</div><span class="arr">&rarr;</span>
      <div class="step"><b>clean + store</b>SQLite</div><span class="arr">&rarr;</span>
      <div class="step"><b>chunk + embed</b>bge-small</div><span class="arr">&rarr;</span>
      <div class="step"><b>5-agent pipeline</b>local LLM</div><span class="arr">&rarr;</span>
      <div class="step"><b>cited report</b>markdown</div><span class="arr">&rarr;</span>
      <div class="step"><b>notify</b>n8n + Slack</div>
    </div>
    <p class="homehint">Retrieval happens first, generation second, and code audits every citation
    afterwards &mdash; anything the evidence does not support is flagged, never shipped silently.
    Ask a question on the left for a quick grounded answer, or generate a full competitor
    report as a background job. <span class="mono" style="font-size:.78rem">Ctrl/Cmd+K</span> focuses the ask box.</p>`;
}

function jobRow(j) {
  const cls = j.status === "succeeded" ? "ok" : j.status === "failed" ? "bad" : "run";
  const label = j.kind === "report" ? (j.result?.topic ?? j.result?.brief ?? "report") : "corpus refresh";
  const src = j.source && j.source !== "api" ? ` <span class="pill run">${esc(j.source)}</span>` : "";
  const who = authMode && j.user && j.user !== "anonymous" ? " - @" + esc(j.user) : "";
  const t = document.createElement("td");
  t.innerHTML = `<span class="jlabel">${esc(label)} ${src}</span>
    <span class="pill ${cls}${cls === "run" ? " live" : ""}">${esc(j.status)}</span>
    <div class="jmeta">${esc(rt(j.created_at))}${j.duration_seconds ? " - " + esc(fmtDur(j.duration_seconds)) : ""}${who}</div>`;
  return t;
}

function jobTr(j) {
  const tr = document.createElement("tr");
  tr.appendChild(jobRow(j));
  tr.onclick = () => showJob(j.job_id);
  tr.title = j.kind + " job " + j.job_id +
    (j.created_at ? " - started " + new Date(j.created_at).toLocaleString() : "");
  return tr;
}

async function refreshJobs() {
  try {
    const jobs = await api("/jobs?limit=8");
    const tb = $("jobs").querySelector("tbody");
    tb.innerHTML = "";
    if (!jobs.length) { tb.innerHTML = '<tr><td class="muted">none yet</td></tr>'; return; }
    for (const j of jobs) tb.appendChild(jobTr(j));
    for (const j of jobs) {
      const active = j.status === "queued" || j.status === "running";
      if (active && !pollers.has(j.job_id)) {
        pollers.set(j.job_id, setInterval(async () => {
          try {
            const nj = await api("/jobs/" + j.job_id);
            if (nj.status !== "queued" && nj.status !== "running") {
              clearInterval(pollers.get(j.job_id)); pollers.delete(j.job_id);
              refreshJobs(); refreshHealth(); loadLearning();
              toast(nj.status === "succeeded" ? "Job finished: " + nj.kind : "Job failed: " + nj.kind,
                    nj.status !== "succeeded");
              if (currentJob === nj.job_id) showJob(nj.job_id);
            }
          } catch { clearInterval(pollers.get(j.job_id)); pollers.delete(j.job_id); }
        }, 3000));
      }
    }
  } catch { /* side nav is best-effort */ }
}

function renderReport(r) {
  const v = r.verdicts ?? {};
  const audit = r.citation_audit ?? {};
  const used = (audit.used ?? []).length;
  const bad = (audit.out_of_range ?? []).length + (audit.uncited_competitor ?? 0);
  const per = Object.entries(r.per_competitor ?? {});
  const max = Math.max(1, ...per.map(([, n]) => Number(n) || 0));
  const el = $("content");
  el.innerHTML = `
    <div class="cards">
      <div class="card"><div class="k">brief</div><div class="v small" style="max-width:260px">${esc(r.brief)}</div></div>
      <div class="card"><div class="k">evidence posts</div><div class="v">${esc(r.evidence)}</div></div>
      <div class="card"><div class="k">verdicts</div><div class="v">${v.SUPPORTED ?? 0}&check; ${v.PARTIAL ?? 0}&tilde; ${v.UNSUPPORTED ?? 0}&times;</div></div>
      <div class="card"><div class="k">citations resolved</div><div class="v ${bad ? "bad" : "ok"}">${used}${bad ? ` (${bad} bad)` : ""}</div></div>
      <div class="card"><div class="k">model</div><div class="v small">${esc(r.provider ?? "?")}/${esc(r.model ?? "?")}</div></div>
    </div>
    ${bad ? `<div class="error">citation audit: ${bad} citation(s) point at evidence that was not retrieved &mdash; see the audit block in the report</div>` : ""}
    <h3>Per competitor</h3>` +
    per.map(([c, n]) =>
      `<div class="barrow"><span>${esc(c)}</span><span class="btrack"><span class="bfill" style="display:block;width:${Math.round(100 * (Number(n) || 0) / max)}%"></span></span><span class="bn">${esc(n)}</span></div>`).join("") +
    `<h3>Report</h3><pre id="md">loading&hellip;</pre>`;
  fetch(r.markdown_url ?? "")
    .then(x => x.text())
    .then(md => { const m = el.querySelector("#md"); if (m) m.textContent = md; })
    .catch(() => { const m = el.querySelector("#md"); if (m) m.textContent = "(markdown unavailable)"; });
}

async function showJob(jobId) {
  currentJob = jobId;
  try {
    const j = await api("/jobs/" + jobId);
    const el = $("content");
    if (j.status === "queued" || j.status === "running") {
      el.innerHTML = `<p class="muted">job <span class="mono">${esc(jobId)}</span> is ${esc(j.status)}&hellip;
        <span class="pill run live">polling every 3s</span></p>`;
      return;
    }
    if (j.status === "failed") {
      el.innerHTML = `<div class="error">job failed: ${esc(j.error ?? "unknown")}</div>`;
      return;
    }
    if (j.kind === "report") renderReport(j.result);
    else {
      const r = j.result ?? {};
      el.innerHTML = `<div class="cards">
        <div class="card"><div class="k">queries run</div><div class="v">${esc(r.queries ?? "?")}${r.queries_planned != null ? "/" + esc(r.queries_planned) : ""}</div></div>
        <div class="card"><div class="k">fetched</div><div class="v">${esc(r.fetched ?? "?")}</div></div>
        <div class="card"><div class="k">new posts kept</div><div class="v">${esc(r.kept ?? r.new_posts ?? "?")}</div></div>
        <div class="card"><div class="k">corpus size</div><div class="v">${esc(r.posts_total ?? "?")}</div></div>
        <div class="card"><div class="k">duration</div><div class="v">${esc(fmtDur(j.duration_seconds))}</div></div>
      </div><p class="muted">The corpus is re-chunked and re-embedded automatically after a refresh.</p>`;
    }
  } catch (e) { $("content").innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}

async function doAsk() {
  const q = $("q").value.trim();
  if (!q) return;
  $("content").innerHTML = `<p class="muted">retrieving evidence and answering&hellip;</p>`;
  try {
    const a = await api("/ask", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({query: q, top_k: Number($("k").value || 5)}),
    });
    const el = $("content");
    const cited = a.answer.replace(/\[(\d+)\]/g, (m, n) => `<sup class="cite" title="source ${esc(n)}">[${n}]</sup>`);
    el.innerHTML = `
      <div class="cards">
        <div class="card"><div class="k">grounded in corpus</div><div class="v ${a.grounded ? "ok" : "bad"}">${a.grounded ? "yes" : "no"}</div></div>
        <div class="card"><div class="k">citations</div><div class="v">${a.citations.length}</div></div>
        <div class="card"><div class="k">sources considered</div><div class="v">${a.sources_considered}</div></div>
      </div>
      <h3>Answer</h3><p>${cited}</p>
      <h3>Cited sources</h3>
      <table><tr><th>#</th><th>post</th><th>title</th></tr>` +
      a.citations.map(c =>
        `<tr><td class="num">[${esc(c.n)}]</td><td class="mono"><a href="${esc(c.url ?? "#")}" target="_blank" rel="noopener">${esc(c.post_id)}</a></td>
         <td>${esc(c.title ?? "")}</td></tr>`).join("") +
      `</table><details><summary>raw JSON</summary><pre>${esc(JSON.stringify(a, null, 2))}</pre></details>`;
  } catch (e) { $("content").innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}

async function startJob(path, body, label) {
  try {
    const j = await api(path, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body),
    });
    toast("Started " + (label ?? j.kind) + " job " + j.job_id.slice(0, 8));
    $("content").innerHTML = `<p class="muted">started ${esc(j.kind)} job <span class="mono">${esc(j.job_id)}</span>&hellip;</p>`;
    refreshJobs();
    setTimeout(() => showJob(j.job_id), 1200);
  } catch (e) { $("content").innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}

$("ask").onclick = doAsk;
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); doAsk(); } });
$("report").onclick = () => startJob("/reports", {
  brief: $("topic").value.trim() || "developer pain points and unmet needs",
  competitors: $("comps").value.split(",").map(s => s.trim().toLowerCase()).filter(Boolean),
}, "report");
$("refresh").onclick = () => startJob("/pipeline/refresh", {}, "refresh");

const EXAMPLES = [
  "What do developers say about platform fees?",
  "Which platform has the worst payout delays?",
  "What integrations are people asking for?",
];
for (const ex of EXAMPLES) {
  const b = document.createElement("span");
  b.className = "chip";
  b.textContent = ex;
  b.title = "Click to fill, click Ask to run";
  b.onclick = () => { $("q").value = ex; $("q").focus(); };
  $("chips").appendChild(b);
}

refreshHealth();
loadLearning();
probeAuth().then(refreshJobs);
setInterval(refreshHealth, 15000);
</script>
</body>
</html>
