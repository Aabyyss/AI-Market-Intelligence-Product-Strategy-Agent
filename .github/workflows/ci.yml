name: CI

# Runs on every push and PR: the unit/regression suite, then a
# retrieval-only evaluation of the RAG index.
#
# The corpus is not committed (data/ is gitignored), so the eval job
# rebuilds one from tests/fixtures/ci_corpus.json with run_corpus.py —
# no Hacker News access needed. Embeddings are recomputed locally, so the
# only download is the bge-small model, which is cached between runs.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Put the model somewhere cacheable instead of fastembed's temp default.
  FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.fastembed_cache

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          mkdir -p "$FASTEMBED_CACHE_DIR"
          pip install -r requirements-dev.txt

      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: ${{ env.FASTEMBED_CACHE_DIR }}
          key: fastembed-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-bge-small-en-v1.5-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            fastembed-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-bge-small-en-v1.5-

      - name: Run the test suite
        run: python -m pytest tests/ -v

      - name: Build the eval corpus from the tracked fixture
        run: python run_corpus.py seed

      # Retrieval-only: no LLM and no API key required. The thresholds are
      # a regression gate — the fixture reproduces the real corpus, so a
      # drop below them means chunking/embedding/search actually changed.
      # --summary renders the report and gate outcome on the run page, so
      # the numbers are visible without downloading the artifact (and it
      # still publishes when the gate fails).
      - name: Retrieval-only evaluation (quality gate)
        run: |
          python run_eval.py --min-mrr 0.8 --min-recall 0.7 \
            --out data/reports/ci_eval.md --summary

      - name: Upload the eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: data/reports/ci_eval.md
          if-no-files-found: ignore

  # The Dockerfile was written long before it was ever built — the smoke
  # tests inside it (sqlite-vec load, embedding model bake) were verified
  # only by reading. Building it here closes that gap: a broken extension
  # load or a bad wheel pin fails this job, not the first real deploy.
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Build the image (runs the sqlite-vec + embedder smoke tests)
        run: docker build -t market-intel:ci .

      - name: Seed the corpus fixture into a shared volume
        run: |
          docker volume create midata
          # Seed runs the embedder inside the image (the bake, verified).
          docker run --rm -v midata:/app/data market-intel:ci \
            python run_corpus.py seed --db /app/data/market_intel.db

      - name: Exercise the live container
        run: |
          docker run -d --name api -p 8000:8000 \
            -v midata:/app/data market-intel:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 2
          done
          echo '--- /health ---';  curl -sf http://127.0.0.1:8000/health
          echo; echo '--- /smoke ---'; curl -sf http://127.0.0.1:8000/smoke
          echo; echo '--- /search ---'
          curl -sf -X POST http://127.0.0.1:8000/search \
            -H 'Content-Type: application/json' \
            -d '{"query":"pricing complaints","top_k":2}' | head -c 400
          echo; echo '--- /console ---'
          curl -sf -o /dev/null -w 'console HTTP %{http_code}\n' \
            http://127.0.0.1:8000/console
